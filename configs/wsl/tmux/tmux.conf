# tmux config: Josean Martinez's setup (josean-dev/dev-environment-files/.tmux.conf,
# https://www.josean.com/posts/tmux-setup) + extra plugins. Same file in every WSL distro.

# --- terminal / colors ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB' # truecolor (WezTerm / Windows Terminal: TERM=xterm-256color)

# --- prefix: Ctrl+a instead of Ctrl+b (press Ctrl+a twice to send Ctrl+a to the shell) -
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# --- splits: prefix | and prefix - ----------------------------------------------------
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# --- reload this file: prefix r --------------------------------------------------------
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- resize panes: prefix h/j/k/l (5 cells), maximize/restore: prefix m ------------------
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

# set the session's default directory to the current pane's folder: prefix Alt+c
bind M-c attach-session -c "#{pane_current_path}"

# --- mouse: click panes, drag borders, scroll ------------------------------------------
set -g mouse on

# --- copy mode: vi keys (prefix [ to enter, v select, y copy; tmux-yank copies to Windows) -
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# --- plugins (prefix I install, prefix U update) ---------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# Josean's list
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l across tmux panes and Neovim splits
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# extras (docs/08)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-logging'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# theme: keep it the LAST plugin - loading it earlier breaks tmux-continuum's auto-save
# (Josean's 2025-09 fix). Previous theme kept for switching back:
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/default/cyan'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
